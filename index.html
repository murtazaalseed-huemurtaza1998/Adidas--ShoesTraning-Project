<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adidas Iraq | متجر احذية اصلية</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-circle"></div>
  <div class="container">
    <nav>
      <a href="#" class="logo">ADIDAS</a>
      <ul>
        <li><a href="#">الرئيسية</a></li>
        <li><a href="#">رجالي</a></li>
        <li><a href="#">نسائي</a></li>
        <li><a href="#">اطفال</a></li>
      </ul>
      <div class="cart">🛒 <span>0</span></div>
    </nav> 

    <div class="content">
      <div class="text">
        <h2>ADIDAS IRAQ<br><span>RUNNING SHOES</span></h2>
        <p>احذية جري اصلية 100%. تقنية Boost للراحة القصوى. شحن مجاني داخل العراق خلال 48 ساعة.</p>
        <div class="colors">
          <span class="color active" data-color="#e60023"></span>
          <span class="color" data-color="#111"></span>
          <span class="color" data-color="#0056b3"></span>
        </div>
        <div class="price">$120</div>
        <a href="#" class="btn add-to-cart">اضف الى السلة</a>
      </div> 
      <div class="image">
        <img class="img" src="img.png" alt="Adidas Shoe" />
      </div>
    </div>
  </div>
<script src="script.js"></script>
</body>
</html>
